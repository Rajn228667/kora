name: kora
description: KORA — Kazakhstan single-store delivery app.
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.3.1
  local_auth: ^2.3.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  equatable: ^2.0.5
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  flutter_map: 8.3.1
  latlong2: 0.9.1
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

# App icon: purple rounded square + white K. Regenerate:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/kora_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/kora_logo_fg.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/legal/
